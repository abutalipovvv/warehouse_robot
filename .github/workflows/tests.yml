name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python test dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            python3-grpcio \
            python3-pyflakes \
            python3-protobuf \
            python3-pytest \
            python3-yaml

      - name: Compile Python packages
        run: python3 -m compileall -q fleet_manager

      - name: Check Python imports and names
        run: |
          find fleet_manager tests -type f -name '*.py' \
            ! -path '*/runtime/grpc/api/proto/*' -print0 \
            | xargs -0 python3 -m pyflakes

      - name: Run architecture tests
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 -m pytest -q \
            tests/test_fleet_architecture.py \
            tests/test_fleet_state_and_planning_architecture.py

      - name: Run root test suite
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 -m pytest -q
