robot_model:
  source: nav2
  # Circumscribed radius of the 1.00 x 0.70 m Ecom body mesh.
  radius: 0.632
  footprint_segments: 4
  footprint:
  - {x: -0.523, y: -0.3532}
  - {x: 0.477, y: -0.3532}
  - {x: 0.477, y: 0.3468}
  - {x: -0.523, y: 0.3468}
  frames:
    lidar:
      x: 0.32487
      y: 0.24906
      label: LiDAR
      color: '#1f6feb'
    imu:
      x: 0
      y: 0
      label: IMU
      color: '#d95521'
    wheel_left:
      x: -0.043001
      y: 0.32282
      label: WL
      color: '#2f3a4a'
    wheel_right:
      x: -0.043001
      y: -0.32758
      label: WR
      color: '#2f3a4a'
navigation:
  route_speed: 1.37
  route_acceleration: 0.6
  simulate_rotation: true
  turn_speed: 0.9
  footprint_lookahead: 0.65
  collision_margin: 0.04
  stop_distance: 0.18
  angular_gain: 2.2
  max_angular_speed: 0.9
  rotate_in_place_angle_deg: 32
  curve_speed_limit: 0.25
  rejoin_speed_limit: 0.16
  hard_rejoin_speed_limit: 0.06
planner:
  nearest_lm_tolerance: 0.01
  trajectory_sample_distance: 0.03
  on_route_tolerance: 0.1
  precision_start_distance: 0.1
localization:
  pose_source: AMCL + IMU-aided odom
  localization_timeout: 0.5
  amcl_correction_timeout: 5
  allowed_lateral_error: 0.02
  allowed_yaw_error_deg: 1
  accept_stale_pose_when_stationary: true
  stationary_linear_velocity_epsilon: 0.02
  stationary_angular_velocity_epsilon: 0.05
manual:
  linear_speed: 0.5
  angular_speed: 1.8
  prediction_time: 1
  prediction_step: 0.1
fleet:
  # Prioritized SIPP is the fast path; CBS is only used when priority ordering
  # cannot resolve a coupled conflict/deadlock.
  planner_backend: hybrid
  reservation_time_step_sec: 1
  reservation_horizon_sec: 10
  # Only this graph-safe prefix is committed. The remaining order route is
  # replanned at the next horizon boundary against fresh robot reservations.
  rolling_horizon_sec: 10
  # Optional discrete cap; 0 means the time horizon is authoritative.
  rolling_horizon_steps: 0
  # Start computing the next chunk before the current one ends. The old
  # committed trajectory remains authoritative until the graph-LM handoff.
  rolling_prefetch_lead_sec: 3
  # Simulation advances on the server independently from browser/websocket
  # clients. A 10 Hz physics clock keeps 50 robots visually smooth.
  simulation_tick_interval_sec: 0.1
  reservation_safety_time_sec: 0.35
  # The Ecom body is one metre long. A 0.10 m traffic envelope leaves safe
  # room on the 1.20 m benchmark graph without pretending it is still TRP1.
  robot_clearance_m: 0.10
  # Explicit graph reservation distance; exact rectangle overlap remains the
  # final authority for spawn and continuous runtime collision checks.
  mapf_min_robot_center_distance_m: 1.15
  # Only simultaneous in-place ROTATE actions share this circumscribed-body
  # resource. Turn-vs-stationary/moving traffic uses exact footprint geometry,
  # so adjacent 1.20 m graph cells do not become an artificial wall.
  mapf_rotation_center_distance_m: 1.304
  # null derives the runtime preview from route speed, acceleration and the
  # spatial footprint lookahead. Set seconds explicitly to tune field robots.
  runtime_collision_lookahead_sec: null
  continuous_collision_step_sec: 0.1
  wait_time_sec: 1
  wait_cost: 6
  order_dispatch_retry_sec: 0.5
  # Repeatedly impossible dense-traffic requests back off instead of pinning
  # one Python core and starving the simulation clock.
  order_dispatch_retry_max_sec: 4
  # Runtime MAPF is dispatched in the background. Small joint groups coordinate
  # new orders without a fleet-wide CBS timeout.
  dispatch_plan_budget_per_tick: 2
  dispatch_joint_batch_size: 4
  # Continuations already coordinate against committed time reservations.
  # Planning them one at a time avoids a synchronized CBS spike every 10 s.
  dispatch_rolling_batch_size: 1
  # Dynamic benchmark orders target distant, but still directed-reachable,
  # graph landmarks. The final choice is random inside the configured far tail.
  dynamic_order_min_hops: 30
  dynamic_order_max_hops: 160
  dynamic_order_far_fraction: 0.08
  replan_interval_sec: 1
  runtime_replan_lm_tolerance_m: 0.1
  # A new MAPF route may start only while the localized robot is at its LM.
  # The planner never creates a straight off-graph connector to that LM.
  start_pose_lm_tolerance_m: 0.1
  deadlock_wait_timeout_sec: 3
  # Keep following the committed route while a predicted blocker is expected
  # to leave. Spatial replanning is allowed only after a persistent stall.
  traffic_replan_after_sec: 8
  deadlock_priority_lease_sec: 2.5
  # Wait/priority ordering is cheaper and more stable than changing routes.
  # Escalate only the coupled wait-cycle to CBS, then retreat as a last resort.
  deadlock_coupled_replan_after_sec: 5
  deadlock_coupled_replan_interval_sec: 4
  deadlock_retreat_after_sec: 12
  remote_route_chunk_lms: 5
  remote_poll_interval_sec: 0.25
  remote_timeout_sec: 0.8
  remote_dispatch_lead_sec: 0.75
  cbs_low_level_max_time: 160
  cbs_max_high_level_nodes: 2000
  cbs_max_planning_time_sec: 5
  # CBS is a local coupled-component solver, never a 50-robot global fallback.
  local_cbs_max_robots: 8
  reservation_detour_horizon_sec: 8
  # Moving robots create time reservations. They do not rewrite the committed
  # shortest spatial route unless deadlock recovery explicitly requests it.
  reserved_edge_detour_enabled: false
  reserved_edge_hard_constraints_enabled: true
  batch_collision_horizon_sec: null
  batch_wait_max_iterations: 60
  stretch_motion_to_reservation_ticks: true
