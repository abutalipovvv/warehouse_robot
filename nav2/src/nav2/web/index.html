<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Robot Operator Panel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="panel">
      <h1 id="mapTitle">Robot Operator Panel</h1>
      <p class="subtitle">
        Живая карта робота. Сайт показывает текущую позу, ближайшую LM и запускает
        движение в два этапа: сначала до ближайшей LM, потом жёстко по LM-графу.
      </p>

      <div class="controls">
        <label>
          Target LM
          <select id="goalSelect"></select>
        </label>
        <div class="button-row">
          <button id="sendGoalButton" class="primary" type="button">Send LM Goal</button>
          <button id="stopButton" class="warning" type="button">Stop</button>
        </div>
      </div>

      <div class="stats">
        <div class="card">
          <div class="card-title">Mode</div>
          <div class="metric" id="modeText">BOOT</div>
        </div>
        <div class="card">
          <div class="card-title">Nearest LM</div>
          <div class="metric" id="nearestLmText">-</div>
          <div class="card-subtext" id="nearestLmDistanceText">-</div>
        </div>
        <div class="card">
          <div class="card-title">Robot Pose</div>
          <div id="robotPoseText">x: -, y: -, yaw: -</div>
        </div>
        <div class="card">
          <div class="card-title">Current Goal</div>
          <div id="goalText">-</div>
        </div>
        <div class="card">
          <div class="card-title">Status</div>
          <div id="statusText">Loading...</div>
        </div>
        <div class="card">
          <div class="card-title">Route Nodes</div>
          <ul id="routeList" class="route-list"></ul>
        </div>
      </div>
    </aside>

    <main class="viewer">
      <svg id="mapSvg">
        <g id="viewport">
          <image id="mapImage" preserveAspectRatio="none"></image>
          <g id="graphLayer"></g>
          <g id="routeLayer"></g>
          <g id="pointLayer"></g>
          <g id="robotLayer"></g>
        </g>
      </svg>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
