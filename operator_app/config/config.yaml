server:
  host: 0.0.0.0
  port: 8780
  probe_timeout: 1.0
  open_browser: false

paths:
  # Empty registry path keeps the default:
  # ~/.config/warehouse_operator/robots.json
  registry: ""
  static_dir: ../web/static

fleet:
  params_path: ../../fleet_manager/config/params.yaml
  # Empty map_dir makes the Operator App load the exact SMAP used by Stage.
  fleet_config: ../../robot/simulation/src/stage_ros2/config/fleet.yaml
  map_dir: ""
